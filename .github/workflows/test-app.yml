name: Test App

on:
    push:
        branches:
            - main
            - stable
        paths:
            - pnpm-lock.yaml
            - app/packages/main/**
    pull_request:
        branches:
            - main
            - stable
        paths:
            - pnpm-lock.yaml
            - app/packages/main/**

jobs:
    test-app:
        name: Test App
        runs-on: ubuntu-latest
        if: ${{ !github.event.repository.private }}
        steps:
            - uses: actions/checkout@v6
              with:
                  sparse-checkout: app

            - uses: pnpm/setup@v3
              with:
                  cache: true

            - name: Install Dependencies
              working-directory: ./app
              run: pnpm install --filter !excalibur-electron

            - name: Run Unit Tests
              working-directory: ./app/packages/main
              run: pnpm run test:unit-run

            - name: Run Component Tests
              working-directory: ./app/packages/main
              run: pnpm run test:component
