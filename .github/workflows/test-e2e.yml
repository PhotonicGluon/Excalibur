name: Test End-to-End

on:
    pull_request:
        branches:
            - main
            - stable
        paths-ignore:
            - "app/changelog/*"
            - "app/changelog.d/*"
            - "server/changelog/*"
            - "server/changelog.d/*"
    workflow_dispatch:

jobs:
    test-e2e:
        name: Test End-to-End
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/setup@v3
              with:
                  cache: true

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version-file: "./server/pyproject.toml"

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  version: "0.12.13"
                  cache-dependency-glob: "server/uv.lock"

            - name: Install App Dependencies
              working-directory: ./app
              run: pnpm install --filter !excalibur-electron

            - name: Install E2E Testing Dependencies
              working-directory: ./
              run: pnpm i

            - name: Run E2E Test
              working-directory: ./
              run: pnpm run test:e2e
