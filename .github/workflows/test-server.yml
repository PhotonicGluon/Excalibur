name: Test Server

on:
    push:
        branches:
            - main
            - stable
        paths:
            - server/uv.lock
            - server/excalibur_server/**
    pull_request:
        branches:
            - main
            - stable
        paths:
            - server/uv.lock
            - server/excalibur_server/**

jobs:
    test-server:
        name: Test Server
        runs-on: ubuntu-latest
        if: ${{ !github.event.repository.private }}
        steps:
            - uses: actions/checkout@v6
              with:
                  sparse-checkout: server

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version-file: "./server/pyproject.toml"

            - name: Install uv
              uses: astral-sh/setup-uv@v7
              with:
                  enable-cache: true
                  version: "0.11.26"
                  cache-dependency-glob: "server/uv.lock"

            - name: Set Up Testing Environment
              working-directory: server
              run: |
                  uv run excalibur init -r

            - name: Run Tests
              working-directory: server
              run: uv run --group test excalibur test
