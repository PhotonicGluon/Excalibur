packages:
  - app
  - app/packages/**

auditConfig:
  ignoreGhsas:
    - GHSA-848j-6mx2-7j84 # Unfixed vulnerability in elliptic

minimumReleaseAge: 7200 # 5 days, expressed in minutes
minimumReleaseAgeExclude:
  - "@esbuild/*"
  - esbuild@0.28.1
  - form-data@4.0.6

blockExoticSubdeps: true

strictDepBuilds: true
allowBuilds:
  cypress: true
  electron: true
  electron-winstaller: true
  esbuild: true
  sharp: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - prettier-plugin-tailwindcss@0.7.4
  - tinyexec@1.2.2
trustPolicyIgnoreAfter: 43200 # 30 days, expressed in minutes

overrides:
  # Main
  plist@>=3.0.0 <4.0.0: "^3.1.1" # To fix `electron-build` issues
  prettier@<3.8.4: ">=3.8.4"
  readable-stream@<=4: ">=4"
  # Security
  "@babel/core@<=7.29.0": ^7.29.1
  esbuild@>=0.17.0 <0.28.1: ^0.28.1
  form-data@>=4.0.0 <4.0.6: ^4.0.6
  js-yaml@<=4.1.1: ^4.1.2
  minimatch@<3.1.4: ^3.1.4
  qs@>=6.11.1 <=6.15.1: ^6.15.2
  tar@<=7.5.15: ^7.5.16
  tmp@<0.2.6: ^0.2.6
  undici@<6.27.0: ^6.27.0
  uuid@<11.1.1: ^11.1.1

patchedDependencies:
  randombytes@2.1.0: app/packages/main/patches/randombytes@2.1.0.patch # To upgrade to latest (b4eb4126fccc503e375853ca7b3e96aaa34af9e6)

sideEffectsCache: false

virtualStoreDirMaxLength: 60
