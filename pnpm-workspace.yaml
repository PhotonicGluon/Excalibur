packages:
  - app
  - app/packages/**

auditConfig:
  ignoreCves:
    - CVE-2025-14505 # Unfixed vulnerability in elliptic

minimumReleaseAge: 7200 # 5 days, expressed in minutes

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - core-js
  - cypress
  - electron
  - electron-winstaller
  - esbuild
  - sharp

overrides:
  "@xmldom/xmldom@<0.8.13": ">=0.8.13"
  minimatch@<3.1.4: ">=3.1.4"
  tar@<=7.5.10: ">=7.5.11"

sideEffectsCache: false

virtualStoreDirMaxLength: 60
