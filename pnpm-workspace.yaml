packages:
  - website

minimumReleaseAge: 7200 # 5 days, expressed in minutes

blockExoticSubdeps: true

strictDepBuilds: true
onlyBuiltDependencies: # CloudFlare uses pnpm v10.11, which doesn't have `allowBuilds`
  - "@swc/core"
  - "@tailwindcss/oxide"
  - "core-js-pure"
  - "core-js"
  - "sharp"

trustPolicy: no-downgrade
trustPolicyExclude:
  - "detect-port@1.6.1"
  - "semver@6.3.1"
trustPolicyIgnoreAfter: 43200 # 30 days, expressed in minutes

overrides:
  serialize-javascript@<7.0.5: ">=7.0.5"
  uuid@<14.0.0: ">=14.0.0"

sideEffectsCache: false

virtualStoreDirMaxLength: 60 # Make this a common setting between different operating systems
