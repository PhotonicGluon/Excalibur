[tool.towncrier]
package = "" # We have more than one package to manage...
name = ""    # ... so we leave these empty

directory = "changelog.d"
single_file = false
filename = "changelog/{version}.md"
underlines = ["", "", ""]
title_format = "## [{version}](https://github.com/PhotonicGluon/Excalibur/tree/{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/PhotonicGluon/Excalibur/issues/{issue})"

[[tool.towncrier.type]]
directory = "security"
name = "🔒️ Security"
showcontent = true

[[tool.towncrier.type]]
directory = "breaking"
name = "💥 Breaking Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "✨ New Features"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "🔄 Changes"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "🐛 Bug Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "performance"
name = "⚡️ Performance Improvements"
showcontent = true

[[tool.towncrier.type]]
directory = "refactor"
name = "♻️ Code Refactoring"
showcontent = true

[[tool.towncrier.type]]
directory = "deps"
name = "⬆️ Dependencies"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "🧹 Miscellaneous"
showcontent = false
