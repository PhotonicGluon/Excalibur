[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[project]
name = "excalibur-server"
version = "0.6.0"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.4",
    "colorama>=0.4.6 ; sys_platform == 'win32'",
    "duckdb~=1.4.4",
    "duckdb-engine>=0.17.0",
    "fastapi>=0.136.1",
    "gitpython>=3.1.50",
    "httptools>=0.7.1",
    "packaging>=26.2",
    "pycryptodome>=3.23.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyjwt>=2.12.1",
    "rapidfuzz>=3.14.5",
    "semver>=3.0.4",
    # Seems to be an issue with `alembic`, `duckdb`, and `sqlalchemy` versions > 2.0.44
    "sqlalchemy<=2.0.44",
    "sqlmodel>=0.0.37",
    "toml>=0.10.2",
    "tomlkit>=0.15.0",
    "typer>=0.25.1",
    "uvicorn>=0.46.0",
    "uvloop>=0.22.1 ; platform_python_implementation != 'PyPy' and sys_platform != 'cygwin' and sys_platform != 'win32'",
    "websockets>=16.0",
]
requires-python = ">=3.11"
authors = [
    { name = "PhotonicGluon", "email" = "25820201+PhotonicGluon@users.noreply.github.com" },
]
description = "A trustless, secure file management solution using military-grade encryption"
readme = "README.md"
license = "GPL-3.0-or-later"

[project.urls]
Repository = "https://github.com/PhotonicGluon/Excalibur.git"
Issues = "https://github.com/PhotonicGluon/Excalibur/issues"

[project.scripts]
excalibur = "excalibur_server.cli:app"

[dependency-groups]
dev = ["ipython~=9.10.1", "ruff>=0.15.12", "watchfiles>=1.1.1"]
test = ["httpx>=0.28.1", "pytest>=9.0.3", "pytest-timeout>=2.4.0"]

[tool.uv]
default-groups = []
exclude-newer = "5 days"

[tool.uv.build-backend]
module-name = "excalibur_server"
module-root = ""
source-exclude = [
    "test*",                             # All test files are excluded
    "excalibur_server/conftest.py",      # Conftest is excluded
    "excalibur_server/cli/build.py",     # Build command is excluded
    "excalibur_server/cli/run_tests.py", # Testing command is excluded
]

[tool.uv.workspace]
members = ["dist/excalibur-server-test"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = [
    "E501", # line-too-long
    "C901", # too-complex
    "I001", # unsorted-imports
    "I002", # missing-required-import
]
